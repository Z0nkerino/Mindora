name: mindora
description: Mindora — your whole life, calmly planned.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  cupertino_ui: ^1.1.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  mindora_glass: any
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Inter (OFL) is bundled and used on the web build only, so the web app
  # never fetches fonts from a third-party CDN. Native platforms use the
  # system font. Subset to Latin + Cyrillic; see assets/fonts/Inter-LICENSE.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
